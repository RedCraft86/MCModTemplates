modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    authors="${mod_author}"
    displayName="Mod Runner"
    description='''Simple utility mod to run all mods in this workspace'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
